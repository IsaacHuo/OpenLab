name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: repository (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  actions:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/tool.mjs actionlint

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node scripts/tool.mjs gitleaks

  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs: [repository, actions, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          ACTIONS_RESULT: ${{ needs.actions.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$ACTIONS_RESULT" = success
          test "$SECRETS_RESULT" = success

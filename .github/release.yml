changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Security
      labels: [security]
    - title: Fixes
      labels: [bug]
    - title: Integrations
      labels: [integration]
    - title: Features
      labels: [enhancement]
    - title: Documentation and governance
      labels: [documentation, "area:governance"]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]

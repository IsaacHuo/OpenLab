<svg xmlns="http://www.w3.org/2000/svg" width="736" height="528" viewBox="0 0 736 528" role="img" aria-labelledby="title description">
  <title id="title">OpenLab architecture direction</title>
  <desc id="description">The browser connects to the local control plane, which owns project storage, the skill catalog and a replaceable runtime adapter. OpenCode connects controlled retrieval tools and user-selected model providers. This is a planned architecture.</desc>
  <style>
    .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .core { fill: #e0f2fe; stroke: #0284c7; }
    .label { fill: #0f172a; font: 15px system-ui, sans-serif; text-anchor: middle; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .node { fill: #1e293b; stroke: #94a3b8; }
      .core { fill: #0c4a6e; stroke: #38bdf8; }
      .label { fill: #f1f5f9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
  </defs>
  <g class="arrow">
    <path d="M 368 72 V 112"/>
    <path d="M 368 168 V 196 H 128 V 224"/>
    <path d="M 368 168 V 224"/>
    <path d="M 368 168 V 196 H 608 V 224"/>
    <path d="M 368 280 V 336"/>
    <path d="M 368 392 V 420 H 128 V 448"/>
    <path d="M 368 392 V 420 H 608 V 448"/>
  </g>
  <g>
    <rect class="node" x="256" y="16" width="224" height="56" rx="10"/>
    <rect class="node core" x="256" y="112" width="224" height="56" rx="10"/>
    <rect class="node" x="16" y="224" width="224" height="56" rx="10"/>
    <rect class="node" x="256" y="224" width="224" height="56" rx="10"/>
    <rect class="node" x="496" y="224" width="224" height="56" rx="10"/>
    <rect class="node" x="256" y="336" width="224" height="56" rx="10"/>
    <rect class="node" x="16" y="448" width="224" height="56" rx="10"/>
    <rect class="node" x="496" y="448" width="224" height="56" rx="10"/>
  </g>
  <g class="label">
    <text x="368" y="50">Browser workspace</text>
    <text x="368" y="146">Local control plane</text>
    <text x="128" y="258">Project metadata + files</text>
    <text x="368" y="258">Runtime adapter</text>
    <text x="608" y="258">Versioned skill catalog</text>
    <text x="368" y="370">OpenCode runtime</text>
    <text x="128" y="482">Retrieval tools + sources</text>
    <text x="608" y="482">User-selected models</text>
  </g>
</svg>

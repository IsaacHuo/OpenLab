title = "OpenLab repository secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies, verified caches and untracked local application/test data"
paths = ['''(^|/)node_modules/''', '''(^|/)\.cache/''', '''(^|/)\.git/''', '''(^|/)\.openlab/''', '''(^|/)dist/''', '''(^|/)test-results/''', '''(^|/)playwright-report/''']
